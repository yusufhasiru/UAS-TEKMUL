<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kara - Detail Karakter</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&display=swap" rel="stylesheet">
    <style>
        /* ============================================== */
        /* 1. BASE STYLES & FONT-FACE & SCALING           */
        /* ============================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            /* Pusatkan kontainer secara horizontal */
            display: flex;
            justify-content: center;
            padding: 10px; 
            overflow: auto; 
        }

        /* * FONT 'GLIKER' - Pastikan file Anda ada */
        @font-face {
            font-family: 'Gliker';
            src: url('gliker-black.woff2') format('woff2'),
                 url('gliker-black.woff') format('woff');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        /* * KONTROL SCALING UTAMA (LEBAR KUNCI: 313px) */
        .mobile-wrapper {
            width: 313px; /* Lebar Kunci Desain Anda: 313px */
            
            overflow: visible; 
            position: relative;
            
            /* Teknik penskalaan: Skala kontainer berdasarkan perbandingan lebar viewport dan lebar tetap (313px). */
            transform-origin: top center;
            transform: scale(calc(100vw / 313)); 
            
            /* Batasan: Di desktop/layar lebar, skala dibatasi agar tidak terlalu besar */
            max-width: 100vw;
        }

        /* Media query untuk Desktop (Memastikan tampilan tidak zoom berlebihan) */
        @media (min-width: 314px) {
            .mobile-wrapper {
                transform: scale(calc(313 / 313)); 
                width: 313px;
            }
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ============================================== */
        /* 2. HEADER & BACK BUTTON                        */
        /* ============================================== */

        .profile-header {
            padding: 30px 16px 20px;
            text-align: center;
            position: relative;
        }

        .profile-header h1 {
            font-family: 'Gliker', 'Poppins', sans-serif;
            font-size: 25px;
            font-weight: 900;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 16px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #f7f1e3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: black;
            font-weight: bold;
            filter: drop-shadow(0 0 10px rgba(255, 165, 0, 0.5)); 
        }

        .back-button::before {
            content: ' < '; 
        }

        /* ============================================== */
        /* 3. KONTEN UTAMA (FOTO & CERITA)                */
        /* ============================================== */

        .profile-content {
            padding: 0 30px 50px; /* Tambahkan padding-bottom untuk ruang sebelum footer */
            text-align: center;
        }

        .image-box-profile {
            width: 150px; 
            height: 150px;
            margin: 20px auto 30px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .image-box-profile img {
            width: auto;
            height: 150px;
            object-fit: cover;
            display: block;
            /* MODIFIKASI UNTUK MEMUSATKAN GAMBAR WOwo */
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            margin-left: 4px;
        }

        .story-text {
            font-family: 'Gliker', 'Poppins', sans-serif;
            font-size: 15px; 
            line-height: 1.5;
            color: black;
            text-align: center;
            font-weight: 900;
            padding: 0 5px;
        }
        
        .story-text strong {
            text-shadow: 0.5px 0.5px 0 #000, -0.5px -0.5px 0 #000;
        }

        /* ============================================== */
        /* 4. FOOTER SOSIAL MEDIA (BOTTOM BUTTONS)        */
        /* ============================================== */

        .social-footer {
            width: 100%;
            padding: 20px;
            background-color: #f7f1e3; 
            
            position: relative;
            border-radius: 5px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        /* Membuat efek miring di batas atas footer */
        

        .social-button {
            padding: 8px 15px;
            background-color: #ffc978;
            border-radius: 20px;
            font-family: 'Gliker', 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #a6a6a6;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
            text-transform: uppercase;
        }

        .social-button:active {
            transform: scale(0.95);
        }

    </style>
</head>
<body>
    <div class="mobile-wrapper">
        
        <header class="profile-header">
            <a href="index.html" class="back-button"></a>
            <h1>Kara</h1>
        </header>

        <main class="profile-content">
            <div class="image-box-profile">
                <img src="foto/foto7.png" alt="Foto Wowo">
            </div>

            <p class="story-text">
Kara adalah Pemidangan berbahan dasar kayu Nantu yang tumbuh subur di perbukitan Bone Bolango. Kayu Nantu dipilih karena kekuatannya yang mampu menahan regangan kain selembut apa pun tanpa merusak seratnya. Kara melambangkan Kestabilan Abadi dan Kesabaran.            </p>
        </main>

        <footer class="social-footer">
            <a href="https://instagram.com/fadhilahgobel" class="social-button" target="_blank">Fadhilah</a>
            <a href="https://instagram.com/yusufhasiru_" class="social-button" target="_blank">Yusuf</a>
            <a href="https://instagram.com/cinderatomayahu_" class="social-button" target="_blank">Cini</a>
        </footer>
    </div>
</body>
</html>
